services:
  nokayune:
    build: .
    container_name: nokayune
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - ./nokayune.db:/app/nokayune.db
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
