services:
  nokayune:
    build: .
    container_name: nokayune
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DB_PATH=/app/data/nokayune.db
      - UPLOADS_DIR=/app/data/uploads
      - BACKUPS_DIR=/app/data/backups
    volumes:
      # Satu folder host (./data) buat semuanya: file .db + pasangan -wal/-shm-nya, foto upload,
      # dan backup. Sengaja mount FOLDER (bukan file .db doang) karena SQLite mode WAL nulis file
      # tambahan (-wal, -shm) di sebelah file utamanya — kalau cuma file .db yang di-mount, file
      # -wal/-shm itu ikut hilang tiap container di-recreate dan bisa bikin data tidak konsisten.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
